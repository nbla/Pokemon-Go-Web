<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Pokémon GO: Today, Upcoming, Raids and Max Battles. Community event data.">
  <title>Pokémon GO · Command Center</title>
  <style>
    :root { color-scheme: dark; --primary-font-family:system-ui,-apple-system,Segoe UI,sans-serif; --primary-text-color:#f4f5f7; --secondary-text-color:#a8b1c0; --secondary-background-color:#263142; --divider-color:#344156; --primary-color:#61c6ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:#111827; color:var(--primary-text-color); font-family:var(--primary-font-family); }
    header { background:#182337; border-bottom:1px solid var(--divider-color); padding:20px max(16px,calc((100vw - 1100px)/2)); }
    header h1 { margin:0; font-size:1.4rem; }
    header p { color:var(--secondary-text-color); margin:5px 0 0; font-size:.85rem; }
    nav { display:flex; gap:6px; max-width:1100px; margin:0 auto; padding:12px 12px 0; }
    nav button { flex:1; border:0; border-bottom:3px solid transparent; border-radius:8px 8px 0 0; background:transparent; color:var(--secondary-text-color); padding:14px 8px; font:600 1rem var(--primary-font-family); cursor:pointer; }
    nav button[aria-selected="true"] { border-color:var(--primary-color); color:var(--primary-text-color); background:#1c2a3e; }
    main { max-width:1100px; margin:0 auto; padding:16px 12px 36px; }
    pokemon-go-card { display:block; width:100%; }
    pokemon-go-card ha-card { display:block; background:#1c2637; border:1px solid var(--divider-color); border-radius:16px; box-shadow:0 8px 25px #0002; }
    footer { text-align:center; color:var(--secondary-text-color); font-size:.75rem; padding:16px; }
    @media (max-width:550px) { header{padding:18px 16px} main{padding:10px 8px 24px} nav{padding:8px 8px 0} }
  </style>
</head>
<body>
  <header><h1>🎮 Pokémon GO · Command Center</h1><p>Today · Upcoming · Raids · Max Battles</p></header>
  <nav aria-label="Välj vy">
    <button data-view="today" aria-selected="true">Today</button>
    <button data-view="upcoming" aria-selected="false">Upcoming</button>
    <button data-view="raids" aria-selected="false">Raids</button>
    <button data-view="max_battles" aria-selected="false">Max Battles</button>
  </nav>
  <main><pokemon-go-card id="dashboard"></pokemon-go-card></main>
  <footer>Community data from ScrapedDuck / Leek Duck. Unofficial fan project.</footer>
  <script src="./pokemon-go-card.js?v=0.9"></script>
  <script>
    const card = document.getElementById('dashboard');
    const tabs = [...document.querySelectorAll('[data-view]')];
    function navigate(view) {
      if (!['today','upcoming','raids','max_battles'].includes(view)) view='today';
      tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.view===view)));
      // Reset data when switching views so the corresponding feed is loaded.
      card.events=[]; card.raids=[]; card.maxBattles=[]; card.loading=true; card.error=''; card.raidError=''; card.maxError='';
      card.setConfig({view});
      history.replaceState(null,'','#'+view);
    }
    tabs.forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
    window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
    navigate(location.hash.slice(1));
  </script>
</body>
</html>
